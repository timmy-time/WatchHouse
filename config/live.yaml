recording:
  root: /data/recordings
  segment_seconds: 10
  ring_minutes: 15
analysis:
  fps: 15
  model: yolov8n.pt
  confidence: 0.30
  imgsz: 640
  pre_roll_seconds: 5
  post_roll_seconds: 10
  max_event_seconds: 300
  tracker_config: config/bytetrack_live.yaml
  # Analysis pipe width. The pipe is what each camera worker reads, so its frame size
  # drives per-frame CPU (rawvideo read, motion diff, preview encode) and detector
  # input. Analysing 1080p burned ~7 of 8 CPU cores; 704px wide cut that to ~1 core
  # with no framing change. 0 = keep native source resolution.
  pipe_width: 0 
  #704
  # Which stream feeds the pipe: "main" keeps the framing that dashboard zones and
  # scenery slots were drawn in. The DVR substream is 4:3 (704x576) with a different
  # vertical field of view, so "sub" requires zones/slots to be redrawn and is only
  # worth it to take decode off the GPU.
  source: main
  # Dual-GPU split: GPU 0 realtime (all cameras), GPU 1 detailed verification
  realtime_gpu: 0
  detailed_gpu: 1
  # Where YOLO runs: "auto"/"gpu" = on the GPU above, "cpu" = on this server's CPU,
  # "remote" = on another machine via remote_url (see below). A camera can override
  # with `device: cpu|gpu|remote|auto` in its own block.
  # ffmpeg always decodes on the GPU: every ffmpeg child is spawned with its own
  # CUDA_VISIBLE_DEVICES pointing at realtime_gpu, so hardware decode keeps working
  # even when inference is CPU-side or fully off-box.
  realtime_device: "${REALTIME_DEVICE:-auto}"
  detailed_device: "${DETAILED_DEVICE:-auto}"
  # Remote inference host (device: "remote"). Run the other side with:
  #   python main.py infer-server --host 0.0.0.0 --port 8099 --device 0
  # Frames are sent as JPEG and tracked boxes come back; each camera keeps its own
  # tracker session remotely. Set this to e.g. http://<windows-or-wsl-lan-ip>:8099
  remote_url: "${REMOTE_INFER_URL:-}"
  remote_timeout: 10.0
  remote_jpeg_quality: 80
  # torch intra-op threads for CPU inference (0 = torch's default). One thread is
  # enough to keep up with a few cameras at the idle frame rate; raise it only if
  # measured fps_analyzed falls behind the target.
  cpu_threads: 2
  detailed_model: yolov8s.pt
  detailed_imgsz: 1280
  detailed_conf: 0.25
  detailed_interval: 2.0
  dynamic_fps:
    enabled: true
    idle_fps: 3.0
    boost_fps: 15.0
    motion_threshold: 0.015
    boost_cooldown: 12.0
faces:
  enabled: true
  min_face_px: 40
  min_det_score: 0.80
  match_threshold: 0.40
  cluster_threshold: 0.45
notifications:
  cooldown_seconds: 60
  dashboard_url: "${DASHBOARD_URL}"
  notify_classes: [person, dog, cat, bear, horse, cow, sheep]
  ntfy: {url: "${NTFY_URL}", topic: "${NTFY_TOPIC}", token: "${NTFY_TOKEN}"}
  webhook: {url: "${WEBHOOK_URL}"}
cameras:
  - name: "${CAM_A_NAME:-Camera A}"
    url: "${CAM_A_URL}"
    sub_url: "${CAM_A_SUB_URL}"
    gpu: 0
    zones:
      - {name: property, type: entry, polygon: [[0.12, 0.30], [1.0, 0.30], [1.0, 1.0], [0.05, 1.0]]}
      - {name: engine_pile, type: ignore, polygon: [[0.65, 0.55], [1.0, 0.55], [1.0, 1.0], [0.65, 1.0]]}
  - name: "${CAM_B_NAME:-Camera B}"
    url: "${CAM_B_URL}"
    sub_url: "${CAM_B_SUB_URL}"
    gpu: 0
    zones:
      - {name: lawn, type: entry, polygon: [[0.0, 0.46], [0.80, 0.46], [0.80, 1.0], [0.0, 1.0]]}
  - name: "${CAM_C_NAME:-Camera C}"
    url: "${CAM_C_URL}"
    sub_url: "${CAM_C_SUB_URL}"
    gpu: 0
    zones:
      - {name: porch, type: entry, polygon: [[0.20, 0.60], [0.60, 0.60], [0.60, 1.0], [0.20, 1.0]]}
  - name: "${CAM_D_NAME:-Camera D}"
    url: "${CAM_D_URL}"
    sub_url: "${CAM_D_SUB_URL}"
    gpu: 0
    confidence: 0.20                      # benchmarked: 83% -> 97% on cars behind foliage
    tracker_config: config/bytetrack_mild.yaml   # long memory, no ID theft on a busy road
    # Live inference only. A high-traffic camera can produce 1000-2000 events/day, so
    # no ring segments and no event clips are written; events still open/close,
    # notify, and keep a compact 960x540 thumbnail as evidence.
    record: false
    zones: []   # optional: add an entry polygon to enable "approaching" alerts
