# Flicker-tolerant but not teleport-prone: keeps the low thresholds and long
# memory, but association stays strict enough to avoid ID stealing on busy roads.
tracker_type: bytetrack
track_high_thresh: 0.15
track_low_thresh: 0.05
new_track_thresh: 0.25
track_buffer: 90
match_thresh: 0.80
fuse_score: True
