
services:
  analysis-engine:
    profiles: ["batch"]
    build: .
    shm_size: '4gb'
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - ./clips:/data/clips:ro
      - ./output:/data/output:rw
    environment:
      - YOLO_CONFIG_DIR=/tmp/Ultralytics
    command: ["scan", "--input", "/data/clips", "--output", "/data/output", "--gpus", "0,1"]

  live:
    build: .
    shm_size: '2gb'
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped
    volumes:
      - ./output:/data/output:rw
      - ./recordings:/data/recordings:rw
      - ./config:/app/config:ro
    environment:
      - TZ=UTC
      - YOLO_CONFIG_DIR=/tmp/Ultralytics
      - NVIDIA_DRIVER_CAPABILITIES=compute,video,utility
      - CAM_CAMA_URL=${CAM_CAMA_URL:-}
      - CAM_CAMB_URL=${CAM_CAMB_URL:-}
      - CAM_CAMC_URL=${CAM_CAMC_URL:-}
      - NTFY_URL=${NTFY_URL:-https://ntfy.sh}
      - NTFY_TOPIC=${NTFY_TOPIC:-}
      - NTFY_TOKEN=${NTFY_TOKEN:-}
      - WEBHOOK_URL=${WEBHOOK_URL:-}
      - DASHBOARD_URL=${DASHBOARD_URL:-http://localhost:8080}
    command: ["live", "--config", "/app/config/live.yaml", "--output", "/data/output"]

  web:
    build: .
    restart: unless-stopped
    ports:
      - "18080:8080"
    volumes:
      - ./clips:/data/clips:ro
      - ./output:/data/output:rw
      - ./config:/app/config:ro
      - ./engine/web/static:/app/engine/web/static:ro
    environment:
      - DASHBOARD_USER=${DASHBOARD_USER:-}
      - DASHBOARD_PASSWORD=${DASHBOARD_PASSWORD:-}
    command: ["serve", "--output", "/data/output", "--clips", "/data/clips", "--config", "/app/config/live.yaml", "--host", "0.0.0.0", "--port", "8080"]

  rtsp-sim:
    image: bluenviron/mediamtx:1.9.3
    profiles: ["sim"]

  rtsp-publisher:
    build: .
    profiles: ["sim"]
    depends_on:
      - rtsp-sim
    volumes:
      - ./clips:/data/clips:ro
    entrypoint:
      - bash
      - -c
      - >
        /usr/bin/ffmpeg -hide_banner -loglevel error -re -stream_loop -1 -i "/data/clips/20260103/3_6_DVR0000_Camera C_30515ca9438a43dab33b4274723d7069_20260103170429.mp4" -map 0:v -c copy -f rtsp -rtsp_transport tcp rtsp://rtsp-sim:8554/camera_c &
        /usr/bin/ffmpeg -hide_banner -loglevel error -re -stream_loop -1 -i "/data/clips/20260103/1_6_DVR0000_Camera A_136488f5ec8d4f0f8beef0396ac85ad3_20260103141555.mp4" -map 0:v -c copy -f rtsp -rtsp_transport tcp rtsp://rtsp-sim:8554/camera a &
        /usr/bin/ffmpeg -hide_banner -loglevel error -re -stream_loop -1 -i "/data/clips/20260103/2_6_DVR0000_Camera B_a3473e0a29a64fe88d616d10a8614ef2_20260103145328.mp4" -map 0:v -c copy -f rtsp -rtsp_transport tcp rtsp://rtsp-sim:8554/camera_b &
        wait
