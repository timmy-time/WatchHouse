
services:
  analysis-engine:
    profiles: ["batch"]
    build: .
    shm_size: '4gb'
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - ./clips:/data/clips:ro
      - ./output:/data/output:rw
    environment:
      - YOLO_CONFIG_DIR=/tmp/Ultralytics
    command: ["scan", "--input", "/data/clips", "--output", "/data/output", "--gpus", "0,1"]

  live:
    build: .
    shm_size: '2gb'
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped
    volumes:
      - ./output:/data/output:rw
      - ./recordings:/data/recordings:rw
      - ./config:/app/config:ro
    environment:
      - TZ=UTC
      - YOLO_CONFIG_DIR=/tmp/Ultralytics
      - NVIDIA_DRIVER_CAPABILITIES=compute,video,utility
      - CAM_A_NAME=${CAM_A_NAME:-Camera A}
      - CAM_B_NAME=${CAM_B_NAME:-Camera B}
      - CAM_C_NAME=${CAM_C_NAME:-Camera C}
      - CAM_D_NAME=${CAM_D_NAME:-Camera D}
      - CAM_A_URL=${CAM_A_URL:-}
      - CAM_B_URL=${CAM_B_URL:-}
      - CAM_C_URL=${CAM_C_URL:-}
      - CAM_D_URL=${CAM_D_URL:-}
      - CAM_A_SUB_URL=${CAM_A_SUB_URL:-}
      - CAM_B_SUB_URL=${CAM_B_SUB_URL:-}
      - CAM_C_SUB_URL=${CAM_C_SUB_URL:-}
      - CAM_D_SUB_URL=${CAM_D_SUB_URL:-}
      - NTFY_URL=${NTFY_URL:-https://ntfy.sh}
      - NTFY_TOPIC=${NTFY_TOPIC:-}
      - NTFY_TOKEN=${NTFY_TOKEN:-}
      - WEBHOOK_URL=${WEBHOOK_URL:-}
      - DASHBOARD_URL=${DASHBOARD_URL:-http://localhost:8080}
      - REALTIME_DEVICE=${REALTIME_DEVICE:-auto}
      - DETAILED_DEVICE=${DETAILED_DEVICE:-auto}
      - REMOTE_INFER_URL=${REMOTE_INFER_URL:-}
    command: ["live", "--config", "/app/config/live.yaml", "--output", "/data/output"]

  web:
    build: .
    restart: unless-stopped
    ports:
      - "18080:8080"
    volumes:
      - ./clips:/data/clips:ro
      - ./output:/data/output:rw
      - ./config:/app/config:ro
      - ./engine/web/static:/app/engine/web/static:ro
    environment:
      - DASHBOARD_USER=${DASHBOARD_USER:-}
      - DASHBOARD_PASSWORD=${DASHBOARD_PASSWORD:-}
      - CAM_A_NAME=${CAM_A_NAME:-Camera A}
      - CAM_B_NAME=${CAM_B_NAME:-Camera B}
      - CAM_C_NAME=${CAM_C_NAME:-Camera C}
      - CAM_D_NAME=${CAM_D_NAME:-Camera D}
    command: ["serve", "--output", "/data/output", "--clips", "/data/clips", "--config", "/app/config/live.yaml", "--host", "0.0.0.0", "--port", "8080"]

  rtsp-sim:
    image: bluenviron/mediamtx:1.9.3
    profiles: ["sim"]

  rtsp-publisher:
    build: .
    profiles: ["sim"]
    depends_on:
      - rtsp-sim
    volumes:
      - ./clips:/data/clips:ro
    environment:
      - CAM_SIM_A=${CAM_SIM_A:-}
      - CAM_SIM_B=${CAM_SIM_B:-}
      - CAM_SIM_C=${CAM_SIM_C:-}
    entrypoint:
      - bash
      - -c
      - >
        /usr/bin/ffmpeg -hide_banner -loglevel error -re -stream_loop -1 -i "$CAM_SIM_C" -map 0:v -c copy -f rtsp -rtsp_transport tcp rtsp://rtsp-sim:8554/camera_c &
        /usr/bin/ffmpeg -hide_banner -loglevel error -re -stream_loop -1 -i "$CAM_SIM_A" -map 0:v -c copy -f rtsp -rtsp_transport tcp rtsp://rtsp-sim:8554/camera_a &
        /usr/bin/ffmpeg -hide_banner -loglevel error -re -stream_loop -1 -i "$CAM_SIM_B" -map 0:v -c copy -f rtsp -rtsp_transport tcp rtsp://rtsp-sim:8554/camera_b &
        wait

  infer-server:
    profiles: ["worker"]
    build: .
    restart: unless-stopped
    ports:
      - "8099:8099"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      - YOLO_CONFIG_DIR=/tmp/Ultralytics
    command: ["infer-server", "--host", "0.0.0.0", "--port", "8099", "--device", "0"]
